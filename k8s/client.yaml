apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-client
  labels:
    app: inventory-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-client
  template:
    metadata:
      labels:
        app: inventory-client
    spec:
      containers:
        - name: client
          image: k8s-inventory-client:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: INVENTORY_URL
              value: http://inventory:8080/inventory
